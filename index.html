<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdSpark AI - استوديو توليد الإعلانات الذكي</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
</head>
<body>

  <header class="app-header">
    <div class="logo-area">
      <h1>⚡ AdSpark AI</h1>
      <span class="badge-tag">Pro Studio 2.0</span>
    </div>
    <div class="user-controls">
      <button id="openAdminBtn" class="admin-btn hidden">⚙️ لوحة المشرف</button>
      <button id="creditPill" class="credit-pill hidden">💎 <span id="creditBalance">1000</span> نقطة</button>
      <button id="gmailLoginBtn" class="login-btn">تسجيل الدخول عبر Gmail</button>
    </div>
  </header>

  <main class="main-container">
    <section class="control-panel">
      <div class="panel-header">
        <div>
          <span class="selected-badge">القالب المختار</span>
          <h2 id="activeTemplateTitle">إعلان سيروم العناية بالبشرة الفاخر</h2>
        </div>
        <div class="output-type-switch">
          <button type="button" class="type-btn active" data-type="video">🎬 فيديو</button>
          <button type="button" class="type-btn" data-type="image">🖼️ صورة</button>
        </div>
      </div>
      
      <div class="input-group">
        <label>النص الترويجي للإعلان:</label>
        <textarea id="promptInput" rows="2" placeholder="اكتب وصف الإعلان..."></textarea>
      </div>

      <div class="pro-options-grid">
        <div class="option-box">
          <label>📐 المقاس:</label>
          <select id="aspectRatioSelect">
            <option value="9:16">9:16 عمودي (TikTok/Reels)</option>
            <option value="1:1">1:1 مربع (Instagram)</option>
            <option value="16:9">16:9 عرضي (YouTube)</option>
          </select>
        </div>

        <div class="option-box">
          <label>🎥 الحركة:</label>
          <select id="motionEffectSelect">
            <option value="zoom-in">تقريب تدريجي (Zoom In)</option>
            <option value="zoom-out">ابتعاد تدريجي (Zoom Out)</option>
            <option value="pulse">نبض ديناميكي (Pulse)</option>
          </select>
        </div>

        <div class="option-box">
          <label>🔘 نص زر الشراء (CTA):</label>
          <input type="text" id="ctaInput" value="اطلبه الآن • خصم لفترة محدودة">
        </div>

        <div class="option-box">
          <label>🎵 الصوت:</label>
          <select id="audioStyleSelect">
            <option value="upbeat">إيقاع ترويجي</option>
            <option value="luxury">هادئ فاخر</option>
            <option value="none">بدون صوت</option>
          </select>
        </div>
      </div>

      <div class="upload-bar">
        <label for="productImageInput" class="upload-label">
          <span>📸 ارفع صورة منتجك (اختياري)</span>
          <span id="uploadFileName" class="file-chip">صورة القالب الافتراضية</span>
        </label>
        <input type="file" id="productImageInput" accept="image/*" class="hidden">
        <button type="button" id="clearProductBtn" class="clear-img-btn hidden">✖ إزالة</button>
      </div>

      <button id="generateBtn" class="generate-btn">
        <span>✨ دمج المنتج وتوليد الإعلان الآن (250 نقطة)</span>
      </button>
    </section>

    <canvas id="renderCanvas" width="720" height="1280" class="hidden"></canvas>

    <section id="resultSection" class="result-section hidden">
      <h3>🎬 الإعلان الجاهز</h3>
      <div class="result-preview-box">
        <video id="outputVideo" controls autoplay loop class="hidden"></video>
        <img id="outputImage" class="hidden" alt="Generated Ad">
      </div>
      <div class="result-actions">
        <button id="downloadBtn" class="action-btn primary">📥 تحميل الإعلان</button>
        <button id="shareBtn" class="action-btn secondary">🔗 نسخ الرابط</button>
      </div>
    </section>

    <section class="templates-section">
      <div class="templates-header">
        <h3>مكتبة القوالب الإعلانية</h3>
        <div class="cat-tabs">
          <button class="cat-tab active" data-cat="all">الكل</button>
          <button class="cat-tab" data-cat="beauty">الجمال</button>
          <button class="cat-tab" data-cat="fashion">الأزياء</button>
          <button class="cat-tab" data-cat="tech">الإلكترونيات</button>
          <button class="cat-tab" data-cat="food">المطاعم</button>
        </div>
      </div>
      <div id="templatesGrid" class="templates-grid"></div>
    </section>
  </main>

  <div id="previewModal" class="modal-backdrop hidden">
    <div class="modal-card">
      <div class="modal-top">
        <h3 id="previewModalTitle">معاينة</h3>
        <button type="button" class="close-modal" data-target="previewModal">✖</button>
      </div>
      <div class="modal-media-wrap">
        <video id="previewModalVideo" controls autoplay loop class="hidden"></video>
        <img id="previewModalImg" class="hidden" alt="Preview">
      </div>
      <p id="previewModalPrompt" class="modal-prompt-text"></p>
      <button type="button" id="usePreviewTemplateBtn" class="generate-btn">✅ اعتماد القالب</button>
    </div>
  </div>

  <div id="adminModal" class="modal-backdrop hidden">
    <div class="modal-card">
      <div class="modal-top">
        <h3>⚙️ إضافة قالب جديد</h3>
        <button type="button" class="close-modal" data-target="adminModal">✖</button>
      </div>
      <form id="addTemplateForm" class="admin-form">
        <input type="text" id="newTplTitle" placeholder="عنوان القالب" required>
        <select id="newTplCategory">
          <option value="beauty">الجمال</option>
          <option value="fashion">الأزياء</option>
          <option value="tech">الإلكترونيات</option>
          <option value="food">المطاعم</option>
        </select>
        <input type="text" id="newTplBadge" placeholder="شارة التميز" value="Viral Ad">
        <textarea id="newTplPrompt" rows="2" placeholder="النص الترويجي" required></textarea>
        <label class="file-upload-admin">
          <span>صورة أو فيديو:</span>
          <input type="file" id="newTplFile" accept="image/*,video/*" required>
        </label>
        <button type="submit" class="generate-btn">➕ نشر</button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
