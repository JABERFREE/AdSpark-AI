<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdSpark AI - استوديو توليد الإعلانات الذكي</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
</head>
<body>

  <!-- رأس الصفحة -->
  <header class="app-header">
    <div class="logo-area">
      <h1>⚡ AdSpark AI</h1>
      <span class="badge-tag">Pro Studio</span>
    </div>
    <div class="user-controls">
      <button id="creditPill" class="credit-pill hidden">💎 <span id="creditBalance">1000</span> نقطة</button>
      <button id="gmailLoginBtn" class="login-btn">تسجيل الدخول عبر Gmail</button>
    </div>
  </header>

  <!-- المحتوى الرئيسي -->
  <main class="main-container">
    
    <!-- قسم التحكم والتوليد -->
    <section class="control-panel">
      <h2 id="activeTemplateTitle">اختر قالباً وابدأ التوليد الفوري</h2>
      
      <div class="input-group">
        <label>نصف الإعلان أو الوصف الترويجي:</label>
        <textarea id="promptInput" rows="3" placeholder="اكتب وصف الإعلان أو ميزات منتجك هنا..."></textarea>
      </div>

      <div class="input-group">
        <label>رفع صورة المنتج (اختياري):</label>
        <input type="file" id="productImageInput" accept="image/*">
        <span id="uploadFileName" class="file-name-hint">لم يتم اختيار صورة</span>
      </div>

      <button id="generateBtn" class="generate-btn">
        <span>✨ توليد الإعلان بالذكاء الاصطناعي</span>
      </button>
    </section>

    <!-- قسم النتائج -->
    <section id="resultSection" class="result-section hidden">
      <h3>🎬 النتيجة النهائية للإعلان</h3>
      <div class="result-preview-box">
        <video id="outputVideo" controls autoplay loop class="hidden"></video>
        <img id="outputImage" class="hidden" alt="Generated Ad">
      </div>
      <div class="result-actions">
        <button id="downloadBtn" class="action-btn primary">📥 تحميل الإعلان</button>
        <button id="shareBtn" class="action-btn secondary">🔗 مشاركة الرابط</button>
      </div>
    </section>

    <!-- قسم استعراض القوالب -->
    <section class="templates-section">
      <h3>استكشف قوالب الإعلانات الجاهزة</h3>
      <div class="cat-tabs">
        <button class="cat-tab active" data-cat="all">الكل</button>
        <button class="cat-tab" data-cat="beauty">العناية والجمال</button>
        <button class="cat-tab" data-cat="fashion">الأزياء والحقائب</button>
        <button class="cat-tab" data-cat="tech">الإلكترونيات</button>
      </div>
      <div id="templatesGrid" class="templates-grid"></div>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
